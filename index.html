<html>
  <head>
    <title> Calculator </title>
  </head>
  <body>
    <h1> Calculator </h1>
    <input type = "number" id="num1" placeholder= "enter number">
    <input type = "number" id="num2" placeholder= "enter number">
    <button onclick= "add()"> + </button>
    <h3 id= "result"> </h3> 
  </body>
  <script> 
   function add(){
     let number1= Number(document.getElementById("num1").value);
     let number2= Number(document.getElementById("num2").value);
     let results= number1 + number2;
     document.getElementById("result").innerHTML= results;
   }
  </script>
</html>
